<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aurum — Premium Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0912;
    --bg-2: #0f0e1a;
    --panel: #16141f;
    --panel-2: #1c1a28;
    --line: rgba(242,237,228,0.08);
    --text: #f2ede4;
    --text-dim: #948da3;
    --text-dimmer: #625c70;
    --gold: #d9b26b;
    --gold-2: #b98a45;
    --lavender: #8b7fa8;
    --danger: #b8544f;
    --radius: 18px;
    --shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .stage{
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(139,127,168,0.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(217,178,107,0.10), transparent 55%),
      var(--bg);
  }

  .app{
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    grid-template-columns: 400px minmax(0, 1fr);
    gap: 1px;
    background: var(--line);
  }

  @media (max-width: 1100px){
    .app{ grid-template-columns: 340px minmax(0, 1fr); }
  }

  @media (max-width: 780px){
    .app{
      grid-template-columns: none;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
      min-height: 100dvh;
    }
  }

  /* ===== LEFT: PLAYER ===== */
  .player{
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    padding: 36px 34px 30px;
    display:flex;
    flex-direction:column;
    min-width:0;
    width: 100%;
    overflow: hidden;
  }

  @media (max-width: 780px){
    .player{ padding: 28px 22px 22px; overflow: visible; }
  }

  @media (min-width: 781px){
    .player{
      position: sticky;
      top: 0;
      align-self: start;
      height: 100vh;
      height: 100dvh;
    }
  }

  .brand{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 30px;
  }
  .brand .mark{
    font-family:'Fraunces', serif;
    font-size: 21px;
    letter-spacing: 0.04em;
    color: var(--gold);
  }
  .brand .mark span{ color: var(--text); }
  .brand .status{
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dimmer);
  }
  .brand .status.on{ color: var(--gold); }

  /* Vinyl */
  .platter-wrap{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 6px 0 26px;
    flex-shrink: 0;
  }
  .platter{
    width: clamp(130px, 26vh, 230px);
    aspect-ratio: 1 / 1;
    flex-shrink: 0;
    border-radius: 50%;
    position: relative;
    background:
      repeating-radial-gradient(circle at center,
        #0d0c14 0px, #0d0c14 2px,
        #17151f 3px, #17151f 5px);
    box-shadow:
      0 20px 45px -15px rgba(0,0,0,0.7),
      inset 0 0 0 1px rgba(255,255,255,0.04);
    animation: spin 9s linear infinite;
    animation-play-state: paused;
    transition: filter .3s;
  }
  .platter.spinning{ animation-play-state: running; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .platter .label{
    position:absolute;
    inset: 32%;
    border-radius:50%;
    background: linear-gradient(145deg, var(--gold), var(--gold-2));
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 26px;
    color: #14111c;
    box-shadow: inset 0 2px 6px rgba(255,255,255,0.35), inset 0 -6px 12px rgba(0,0,0,0.25);
    overflow:hidden;
  }
  .platter .label img{ width:100%; height:100%; object-fit:cover; }
  .platter .spindle{
    position:absolute;
    inset: calc(50% - 5px);
    width:10px; height:10px;
    border-radius:50%;
    background: #0a0912;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.5);
  }

  .tonearm{
    position:absolute;
    top: -6px;
    right: 8px;
    width: clamp(46px, 9vh, 78px);
    aspect-ratio: 1 / 1;
    flex-shrink: 0;
    transform-origin: 88% 12%;
    transform: rotate(-24deg);
    transition: transform .5s cubic-bezier(.4,0,.2,1);
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
  }
  .tonearm.down{ transform: rotate(3deg); }

  /* Track info */
  .track-info{ text-align:center; margin-bottom: 22px; }
  .track-title{
    font-family:'Fraunces', serif;
    font-size: 24px;
    font-weight: 600;
    line-height:1.25;
    white-space: nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
  }
  .track-artist{
    margin-top:6px;
    font-size: 13.5px;
    color: var(--text-dim);
    font-weight:500;
  }

  @media (max-width: 780px){
    .track-title{ font-size: 20px; }
    .platter-wrap{ padding: 4px 0 20px; }
    .track-info{ margin-bottom: 18px; }
  }

  /* Progress */
  .progress-row{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-bottom: 22px;
  }
  .time{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dimmer);
    width: 38px;
    flex-shrink:0;
  }
  .time.right{ text-align:right; }

  .seek{
    -webkit-appearance:none;
    appearance:none;
    flex:1;
    height: 4px;
    border-radius:4px;
    background: linear-gradient(to right, var(--gold) 0%, var(--gold) 0%, var(--line) 0%, var(--line) 100%);
    outline:none;
    cursor:pointer;
  }
  .seek::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:13px; height:13px; border-radius:50%;
    background: var(--gold);
    box-shadow: 0 0 0 4px rgba(217,178,107,0.18);
    cursor:pointer;
    transition: transform .15s;
  }
  .seek:hover::-webkit-slider-thumb{ transform: scale(1.15); }
  .seek::-moz-range-thumb{
    width:13px; height:13px; border-radius:50%; border:none;
    background: var(--gold);
    box-shadow: 0 0 0 4px rgba(217,178,107,0.18);
    cursor:pointer;
  }

  /* Controls */
  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 20px;
    margin-bottom: 26px;
  }

  @media (max-width: 380px){
    .controls{ gap: 12px; }
    .play-btn{ width: 50px; height: 50px; }
  }
  .ctrl-btn{
    background:none;
    border:none;
    color: var(--text-dim);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 8px;
    border-radius:50%;
    flex-shrink: 0;
    transition: color .15s, background .15s, transform .1s;
  }
  .ctrl-btn:hover{ color: var(--text); background: rgba(255,255,255,0.05); }
  .ctrl-btn:active{ transform: scale(0.92); }
  .ctrl-btn.active{ color: var(--gold); }
  .ctrl-btn svg{ width:18px; height:18px; }

  .play-btn{
    width: 56px; height:56px;
    flex-shrink: 0;
    border-radius:50%;
    background: linear-gradient(145deg, var(--gold), var(--gold-2));
    color:#14111c;
    display:flex; align-items:center; justify-content:center;
    border:none; cursor:pointer;
    box-shadow: 0 12px 24px -8px rgba(217,178,107,0.45);
    transition: transform .12s;
  }
  .play-btn:hover{ transform: scale(1.04); }
  .play-btn:active{ transform: scale(0.95); }
  .play-btn svg{ width:20px; height:20px; }

  /* Volume + import */
  .lower-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 12px;
    margin-top: auto;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }

  @media (max-width: 340px){
    .import-btn span{ display:none; }
    .import-btn{ padding: 9px 11px; }
  }
  .volume{
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
    min-width:0;
  }
  .volume svg{ width:16px; height:16px; color: var(--text-dim); flex-shrink:0; }
  .vol-slider{
    -webkit-appearance:none;
    width: 100%;
    max-width: 100px;
    flex: 1;
    min-width: 50px;
    height:4px;
    border-radius:4px;
    background: linear-gradient(to right, var(--lavender) 70%, var(--line) 70%);
    outline:none;
    cursor:pointer;
  }
  .vol-slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:11px; height:11px; border-radius:50%;
    background: var(--lavender);
    cursor:pointer;
  }
  .vol-slider::-moz-range-thumb{
    width:11px; height:11px; border-radius:50%; border:none;
    background: var(--lavender); cursor:pointer;
  }

  .import-btn{
    display:flex;
    align-items:center;
    gap:7px;
    background: rgba(217,178,107,0.08);
    border: 1px solid rgba(217,178,107,0.3);
    color: var(--gold);
    font-size: 12px;
    font-weight:600;
    padding: 9px 14px;
    border-radius: 999px;
    cursor:pointer;
    white-space:nowrap;
    transition: background .15s, transform .1s;
  }
  .import-btn:hover{ background: rgba(217,178,107,0.15); }
  .import-btn:active{ transform: scale(0.97); }
  .import-btn svg{ width:14px; height:14px; }

  /* ===== RIGHT: PLAYLIST ===== */
  .queue{
    background: var(--panel);
    padding: 32px 28px;
    display:flex;
    flex-direction:column;
    min-height: 100vh;
    min-height: 100dvh;
  }

  @media (max-width: 780px){
    .queue{ min-height: 0; padding: 24px 20px 28px; }
  }
  .queue-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 18px;
  }
  .queue-head h2{
    margin:0;
    font-family:'Fraunces', serif;
    font-size: 18px;
    font-weight:600;
  }

  @media (max-width: 780px){
    .queue-head{ margin-bottom: 14px; }
    .autoplay-toggle{ margin-bottom: 14px; }
  }
  .queue-count{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dimmer);
  }

  .autoplay-toggle{
    display:flex;
    align-items:center;
    gap:9px;
    margin-bottom: 18px;
    font-size: 12.5px;
    color: var(--text-dim);
    cursor:pointer;
    user-select:none;
  }
  .switch{
    width: 34px; height: 19px;
    border-radius: 999px;
    background: var(--line);
    position:relative;
    transition: background .2s;
    flex-shrink:0;
  }
  .switch::after{
    content:'';
    position:absolute;
    top:2px; left:2px;
    width:15px; height:15px;
    border-radius:50%;
    background: var(--text-dim);
    transition: transform .2s, background .2s;
  }
  .switch.on{ background: rgba(217,178,107,0.35); }
  .switch.on::after{ transform: translateX(15px); background: var(--gold); }

  .track-list{
    list-style:none;
    margin:0; padding:0;
    overflow-y:auto;
    flex:1;
    min-height: 120px;
    display:flex;
    flex-direction:column;
    gap: 2px;
  }
  .track-list::-webkit-scrollbar{ width:6px; }
  .track-list::-webkit-scrollbar-thumb{ background: var(--line); border-radius:4px; }

  .track-item{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 10px 10px;
    border-radius: 10px;
    cursor:pointer;
    transition: background .15s;
    position:relative;
  }
  .track-item:hover{ background: rgba(255,255,255,0.04); }
  .track-item.playing{ background: rgba(217,178,107,0.08); }

  .track-index{
    width: 20px;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dimmer);
    flex-shrink:0;
  }
  .track-item.playing .track-index{ color: var(--gold); }
  .eq{
    display:flex;
    align-items:flex-end;
    gap:2px;
    height:12px;
    width: 20px;
    justify-content:center;
  }
  .eq span{
    width:3px;
    background: var(--gold);
    border-radius:1px;
    animation: eq 0.9s ease-in-out infinite;
  }
  .eq span:nth-child(1){ height:40%; animation-delay:0s; }
  .eq span:nth-child(2){ height:100%; animation-delay:.2s; }
  .eq span:nth-child(3){ height:65%; animation-delay:.4s; }
  @keyframes eq{ 0%,100%{ transform: scaleY(0.4); } 50%{ transform: scaleY(1); } }

  .track-meta{ min-width:0; flex:1; }
  .track-meta .t{
    font-size: 13.5px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-item.playing .track-meta .t{ color: var(--gold); }
  .track-meta .a{
    font-size: 11.5px;
    color: var(--text-dimmer);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-dur{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dimmer);
    flex-shrink:0;
  }
  .track-remove{
    background:none; border:none;
    color: var(--text-dimmer);
    cursor:pointer;
    opacity:0;
    transition: opacity .15s, color .15s;
    padding:4px;
    display:flex;
    flex-shrink:0;
  }
  .track-item:hover .track-remove{ opacity:1; }
  .track-remove:hover{ color: var(--danger); }
  .track-remove svg{ width:13px; height:13px; }

  /* empty state */
  .empty{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap: 14px;
    padding: 30px 10px;
    color: var(--text-dimmer);
  }
  .empty svg{ width:34px; height:34px; opacity:.5; }
  .empty p{ margin:0; font-size:13px; max-width:220px; line-height:1.5; }
  .empty .import-btn{ margin-top:4px; }

  input[type="file"]{ display:none; }

  .queue-drop{
    margin-top: 16px;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    padding: 14px;
    text-align:center;
    font-size: 11.5px;
    color: var(--text-dimmer);
    transition: border-color .15s, background .15s;
  }
  .queue-drop.hover{
    border-color: var(--gold);
    background: rgba(217,178,107,0.05);
    color: var(--gold);
  }
</style>
</head>
<body>

<div class="stage">
  <div class="app">

    <!-- PLAYER -->
    <div class="player">
      <div class="brand">
        <div class="mark">AUR<span>UM</span></div>
        <div class="status" id="statusText">PAUSED</div>
      </div>

      <div class="platter-wrap">
        <div class="platter" id="platter">
          <div class="label" id="platterLabel">—</div>
          <div class="spindle"></div>
        </div>
        <svg class="tonearm" id="tonearm" viewBox="0 0 78 78" fill="none">
          <circle cx="66" cy="10" r="7" fill="#2a2735" stroke="var(--gold)" stroke-width="1.5"/>
          <rect x="60" y="8" width="5" height="58" rx="2.5" fill="#2a2735" transform="rotate(18 66 10)"/>
          <circle cx="17" cy="60" r="3.5" fill="var(--gold)" transform="rotate(18 66 10) translate(0 0)"/>
        </svg>
      </div>

      <div class="track-info">
        <div class="track-title" id="titleText">No track loaded</div>
        <div class="track-artist" id="artistText">Import a song to begin</div>
      </div>

      <div class="progress-row">
        <span class="time" id="curTime">0:00</span>
        <input type="range" class="seek" id="seek" min="0" max="100" value="0" step="0.1">
        <span class="time right" id="durTime">0:00</span>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="shuffleBtn" title="Shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
        </button>
        <button class="ctrl-btn" id="prevBtn" title="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6v12l-8.5-6z"/></svg>
        </button>
        <button class="play-btn" id="playBtn" title="Play/Pause">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" title="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6v12l8.5-6z"/></svg>
        </button>
        <button class="ctrl-btn" id="repeatBtn" title="Repeat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>

      <div class="lower-row">
        <div class="volume">
          <svg id="volIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16 8.5a4 4 0 0 1 0 7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
          <input type="range" class="vol-slider" id="volume" min="0" max="100" value="70">
        </div>
        <button class="import-btn" id="importBtnPlayer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span>Import</span>
        </button>
      </div>
    </div>

    <!-- QUEUE -->
    <div class="queue">
      <div class="queue-head">
        <h2>Playlist</h2>
        <span class="queue-count" id="queueCount">0 tracks</span>
      </div>

      <label class="autoplay-toggle" id="autoplayToggle">
        <span class="switch" id="autoplaySwitch"></span>
        Autoplay next track
      </label>

      <ul class="track-list" id="trackList"></ul>

      <div class="queue-drop" id="dropZone">Drag audio files here, or use Import</div>
    </div>

  </div>
</div>

<input type="file" id="fileInput" accept="audio/*" multiple>

<script>
(function(){
  const audio = new Audio();
  let playlist = [];
  let currentIndex = -1;
  let isShuffle = false;
  let repeatMode = 0; // 0 off, 1 all, 2 one
  let isAutoplay = true;

  const els = {
    platter: document.getElementById('platter'),
    platterLabel: document.getElementById('platterLabel'),
    tonearm: document.getElementById('tonearm'),
    title: document.getElementById('titleText'),
    artist: document.getElementById('artistText'),
    status: document.getElementById('statusText'),
    seek: document.getElementById('seek'),
    curTime: document.getElementById('curTime'),
    durTime: document.getElementById('durTime'),
    playBtn: document.getElementById('playBtn'),
    playIcon: document.getElementById('playIcon'),
    prevBtn: document.getElementById('prevBtn'),
    nextBtn: document.getElementById('nextBtn'),
    shuffleBtn: document.getElementById('shuffleBtn'),
    repeatBtn: document.getElementById('repeatBtn'),
    volume: document.getElementById('volume'),
    volIcon: document.getElementById('volIcon'),
    trackList: document.getElementById('trackList'),
    queueCount: document.getElementById('queueCount'),
    fileInput: document.getElementById('fileInput'),
    importBtnPlayer: document.getElementById('importBtnPlayer'),
    autoplayToggle: document.getElementById('autoplayToggle'),
    autoplaySwitch: document.getElementById('autoplaySwitch'),
    dropZone: document.getElementById('dropZone'),
  };

  const PLAY_ICON = '<path d="M8 5v14l11-7z"/>';
  const PAUSE_ICON = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';

  function fmtTime(sec){
    if (!isFinite(sec) || isNaN(sec)) return '0:00';
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60);
    return m + ':' + String(s).padStart(2,'0');
  }

  function initials(name){
    return name.split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '—';
  }

  function renderList(){
    els.trackList.innerHTML = '';
    els.queueCount.textContent = playlist.length + (playlist.length===1 ? ' track' : ' tracks');

    if (playlist.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <p>Your playlist is empty. Import audio files from your device to start listening.</p>
        <button class="import-btn" id="emptyImportBtn">Import songs</button>
      `;
      els.trackList.appendChild(empty);
      document.getElementById('emptyImportBtn').addEventListener('click', ()=> els.fileInput.click());
      return;
    }

    playlist.forEach((track, i) => {
      const li = document.createElement('li');
      li.className = 'track-item' + (i === currentIndex ? ' playing' : '');
      li.innerHTML = `
        <span class="track-index">${ i === currentIndex && !audio.paused ? '' : (i+1) }</span>
        ${ i === currentIndex && !audio.paused ? '<span class="eq"><span></span><span></span><span></span></span>' : '' }
        <span class="track-meta">
          <div class="t">${track.title}</div>
          <div class="a">${track.artist}</div>
        </span>
        <span class="track-dur">${track.duration ? fmtTime(track.duration) : '--:--'}</span>
        <button class="track-remove" data-i="${i}" title="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      `;
      li.addEventListener('click', (e)=>{
        if (e.target.closest('.track-remove')) return;
        loadTrack(i);
        play();
      });
      els.trackList.appendChild(li);
    });

    els.trackList.querySelectorAll('.track-remove').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const i = parseInt(btn.dataset.i, 10);
        removeTrack(i);
      });
    });
  }

  function removeTrack(i){
    const removingCurrent = i === currentIndex;
    URL.revokeObjectURL(playlist[i].url);
    playlist.splice(i,1);
    if (removingCurrent){
      audio.pause();
      currentIndex = -1;
      resetNowPlaying();
      if (playlist.length){ loadTrack(0); }
    } else if (i < currentIndex){
      currentIndex--;
    }
    renderList();
  }

  function resetNowPlaying(){
    els.title.textContent = 'No track loaded';
    els.artist.textContent = 'Import a song to begin';
    els.platterLabel.textContent = '—';
    els.seek.value = 0;
    els.curTime.textContent = '0:00';
    els.durTime.textContent = '0:00';
    setPlayingUI(false);
  }

  function loadTrack(i){
    if (i < 0 || i >= playlist.length) return;
    currentIndex = i;
    const track = playlist[i];
    audio.src = track.url;
    els.title.textContent = track.title;
    els.artist.textContent = track.artist;
    els.platterLabel.textContent = initials(track.title);
    renderList();
  }

  function play(){
    if (currentIndex === -1 && playlist.length){ loadTrack(0); }
    if (currentIndex === -1) return;
    audio.play();
  }

  function pause(){ audio.pause(); }

  function togglePlay(){
    if (playlist.length === 0){ els.fileInput.click(); return; }
    if (audio.paused) play(); else pause();
  }

  function setPlayingUI(playing){
    els.playIcon.innerHTML = playing ? PAUSE_ICON : PLAY_ICON;
    els.platter.classList.toggle('spinning', playing);
    els.tonearm.classList.toggle('down', playing);
    els.status.textContent = playing ? 'PLAYING' : 'PAUSED';
    els.status.classList.toggle('on', playing);
  }

  function nextTrack(auto){
    if (playlist.length === 0) return;
    if (repeatMode === 2 && auto){ audio.currentTime = 0; play(); return; }
    let i;
    if (isShuffle){
      if (playlist.length === 1) i = 0;
      else { do { i = Math.floor(Math.random()*playlist.length); } while(i === currentIndex); }
    } else {
      i = currentIndex + 1;
      if (i >= playlist.length){
        if (repeatMode === 1) i = 0;
        else { setPlayingUI(false); return; }
      }
    }
    loadTrack(i);
    if (!auto || isAutoplay) play();
  }

  function prevTrack(){
    if (playlist.length === 0) return;
    if (audio.currentTime > 3){ audio.currentTime = 0; return; }
    let i = currentIndex - 1;
    if (i < 0) i = repeatMode === 1 ? playlist.length - 1 : 0;
    loadTrack(i);
    play();
  }

  // ===== Audio events =====
  audio.addEventListener('play', ()=>{ setPlayingUI(true); renderList(); });
  audio.addEventListener('pause', ()=>{ setPlayingUI(false); renderList(); });
  audio.addEventListener('timeupdate', ()=>{
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    els.seek.value = pct;
    els.seek.style.background = `linear-gradient(to right, var(--gold) ${pct}%, var(--gold) ${pct}%, var(--line) ${pct}%, var(--line) 100%)`;
    els.curTime.textContent = fmtTime(audio.currentTime);
  });
  audio.addEventListener('loadedmetadata', ()=>{
    els.durTime.textContent = fmtTime(audio.duration);
    if (currentIndex !== -1){
      playlist[currentIndex].duration = audio.duration;
      renderList();
    }
  });
  audio.addEventListener('ended', ()=>{ nextTrack(true); });

  // ===== Controls =====
  els.playBtn.addEventListener('click', togglePlay);
  els.nextBtn.addEventListener('click', ()=> nextTrack(false));
  els.prevBtn.addEventListener('click', prevTrack);

  els.shuffleBtn.addEventListener('click', ()=>{
    isShuffle = !isShuffle;
    els.shuffleBtn.classList.toggle('active', isShuffle);
  });

  els.repeatBtn.addEventListener('click', ()=>{
    repeatMode = (repeatMode + 1) % 3;
    els.repeatBtn.classList.toggle('active', repeatMode !== 0);
    els.repeatBtn.style.opacity = repeatMode === 2 ? '0.7' : '1';
    els.repeatBtn.title = repeatMode === 0 ? 'Repeat off' : repeatMode === 1 ? 'Repeat all' : 'Repeat one';
  });

  els.seek.addEventListener('input', ()=>{
    if (!audio.duration) return;
    const t = (els.seek.value/100) * audio.duration;
    audio.currentTime = t;
  });

  els.volume.addEventListener('input', ()=>{
    const v = els.volume.value;
    audio.volume = v/100;
    els.volume.style.background = `linear-gradient(to right, var(--lavender) ${v}%, var(--line) ${v}%)`;
  });
  audio.volume = 0.7;
  els.volume.style.background = `linear-gradient(to right, var(--lavender) 70%, var(--line) 70%)`;

  els.autoplayToggle.addEventListener('click', ()=>{
    isAutoplay = !isAutoplay;
    els.autoplaySwitch.classList.toggle('on', isAutoplay);
  });
  els.autoplaySwitch.classList.toggle('on', isAutoplay);

  // ===== Import =====
  function handleFiles(fileList){
    const files = Array.from(fileList).filter(f => f.type.startsWith('audio/'));
    files.forEach(file => {
      const url = URL.createObjectURL(file);
      const rawName = file.name.replace(/\.[^/.]+$/, '');
      let title = rawName, artist = 'Unknown artist';
      if (rawName.includes(' - ')){
        const parts = rawName.split(' - ');
        artist = parts[0].trim();
        title = parts.slice(1).join(' - ').trim();
      }
      playlist.push({ title, artist, url, duration: null });
    });
    renderList();
    if (currentIndex === -1 && playlist.length){ loadTrack(0); }
  }

  els.fileInput.addEventListener('change', (e)=> handleFiles(e.target.files));
  els.importBtnPlayer.addEventListener('click', ()=> els.fileInput.click());

  els.dropZone.addEventListener('dragover', (e)=>{ e.preventDefault(); els.dropZone.classList.add('hover'); });
  els.dropZone.addEventListener('dragleave', ()=> els.dropZone.classList.remove('hover'));
  els.dropZone.addEventListener('drop', (e)=>{
    e.preventDefault();
    els.dropZone.classList.remove('hover');
    handleFiles(e.dataTransfer.files);
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e)=>{
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight'){ nextTrack(false); }
    if (e.code === 'ArrowLeft'){ prevTrack(); }
  });

  renderList();
})();
</script>
</body>
</html>
